<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare AI - Web Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-dark: #0F172A;
            --bg-card: #1E293B;
            --text-main: #F8FAFC;
            --text-dim: #94A3B8;
            --accent: #10B981;
            --error: #EF4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 1.5rem 2rem;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, #818CF8, #4F46E5);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            padding: 0.4rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        #chat-container {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: 1.25rem;
            line-height: 1.6;
            position: relative;
            animation: slideIn 0.3s ease-out;
            unicode-bidi: plaintext;
            /* Better RTL/LTR mixed content handling */
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.ai {
            align-self: flex-start;
            background: var(--bg-card);
            color: var(--text-main);
            border-bottom-left-radius: 0.25rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .input-area {
            padding: 2rem;
            background: linear-gradient(transparent, var(--bg-dark) 40%);
            position: sticky;
            bottom: 0;
            width: 100%;
        }

        .input-box {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            display: flex;
            padding: 0.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s;
        }

        .input-box:focus-within {
            border-color: var(--primary);
        }

        #message-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 0.75rem 1rem;
            font-size: 1rem;
            outline: none;
        }

        button#send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button#send-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        button#send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #chat-container::-webkit-scrollbar {
            width: 6px;
        }

        #chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .triage-indicator {
            font-size: 0.7rem;
            margin-top: 0.5rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 10px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-dim);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
            </svg>
            SkillForge AI
        </div>
        <div id="status" class="status-badge">
            <div class="status-dot"></div>
            API Online
        </div>
    </header>

    <main>
        <div id="chat-container">
            <div class="message ai" dir="auto">
                السلام علیکم! میں آپ کا AI صحت معاون ہوں۔ میں آپ کی علامات کو سمجھنے اور آپ کو صحیح مشورہ دینے میں مدد
                کروں گا۔
                <br><br>
                آپ کو آج کیا محسوس ہو رہا ہے؟
                <div class="triage-indicator">Welcome</div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <input type="text" id="message-input" placeholder="Type your symptoms here..." autocomplete="off">
                <button id="send-btn">
                    Send
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const statusBadge = document.getElementById('status');

        const API_URL = 'http://localhost:8000/api/v1/chat';
        let sessionId = 'web_' + Math.random().toString(36).substr(2, 9);

        // Check API health
        fetch('http://localhost:8000/health')
            .then(() => {
                statusBadge.innerHTML = '<div class="status-dot"></div> API Online';
                statusBadge.style.color = '#10B981';
            })
            .catch(() => {
                statusBadge.innerHTML = '<div class="status-dot" style="background: #EF4444; box-shadow: 0 0 12px #EF4444"></div> API Offline';
                statusBadge.style.color = '#EF4444';
            });

        function appendMessage(text, role, triage = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.setAttribute('dir', 'auto'); // Auto-detect RTL for each message

            let content = text;
            if (triage) {
                content += `<div class="triage-indicator">Triage: ${triage}</div>`;
            }

            msgDiv.innerHTML = content;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai typing-bubble';
            typingDiv.id = 'typing';
            typingDiv.innerHTML = '<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user');
            messageInput.value = '';

            sendBtn.disabled = true;
            showTyping();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        message: message,
                        language: 'ur' // Default to Urdu for this demo
                    })
                });

                const data = await response.json();
                removeTyping();

                if (data.response) {
                    appendMessage(data.response, 'ai', data.triage_level);
                } else {
                    appendMessage("Sorry, I encountered an error processing your message.", 'ai');
                }
            } catch (error) {
                removeTyping();
                appendMessage("Connection error. Is the backend running on http://localhost:8000?", 'ai');
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>

</html>
